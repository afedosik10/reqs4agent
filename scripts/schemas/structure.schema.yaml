# R4A schema — domains/structure.yaml (FR-CON-002). JSON Schema draft 2020-12, YAML form.
# structure.yaml is the machine-readable SSOT of the domain map and ID codes (NAMING.md).
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required: [version, domains]
properties:
  version:     { type: string }
  description: { type: string }
  domains:
    type: object
    minProperties: 1
    propertyNames: { pattern: "^[a-z][a-z0-9_]*$" }
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, code]
      properties:
        description:     { type: string, minLength: 1 }
        code:            { type: string, pattern: "^[A-Z]{2,5}$" }  # domain ID code; unique repo-wide (validate checks)
        has_sub_domains: { type: boolean }   # default true when sub_domains present, false otherwise
        sub_domains:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, description]
            properties:
              id:          { type: string, pattern: "^[a-z][a-z0-9_]*$" }
              description: { type: string, minLength: 1 }
