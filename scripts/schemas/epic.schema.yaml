# R4A schema — epic frontmatter (FR-CON-005, FR-CON-003). JSON Schema draft 2020-12, YAML form.
# parent_vision is REQUIRED: every epic traces to a vision.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: true
required: [id, type, status, version, last_updated, owner, domain, parent_vision]
properties:
  id:            { type: string, pattern: "^EPIC-[A-Z]{2,5}-[0-9]{3}$" }
  type:          { const: epic }
  status:        { enum: [draft, ready_for_review, approved, in_progress, implemented, postponed, deprecated] }
  version:       { oneOf: [{ type: string, pattern: "^[0-9]+\\.[0-9]+$" }, { type: number }] }
  last_updated:  { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  owner:         { type: string, minLength: 1 }
  domain:        { type: string, pattern: "^[a-z][a-z0-9_]*$" }
  sub_domain:    { type: string, pattern: "^[a-z][a-z0-9_]*$" }
  parent_vision: { type: string, pattern: "^VIS-[0-9]{3}$" }
  release:       { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
  external_id:   { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
  depends_on:    { $ref: "#/$defs/idOrIdList" }
  see_also:      { $ref: "#/$defs/idOrIdList" }
  updates:       { $ref: "#/$defs/idOrIdList" }
  updated_by:    { $ref: "#/$defs/idOrIdList" }
  open_questions: { type: array, items: { type: string, minLength: 3, pattern: '^Q-\d+: ' } }
  source:        { type: string, minLength: 1 }
$defs:
  artifactId: { type: string, pattern: "^(VIS|ROADMAP)-[0-9]{3}$|^(EPIC|FEATURE|US)-[A-Z]{2,5}-[0-9]{3}$" }
  idOrIdList:
    oneOf:
      - { $ref: "#/$defs/artifactId" }
      - { type: array, items: { $ref: "#/$defs/artifactId" }, minItems: 1 }
