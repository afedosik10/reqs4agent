# R4A ingest proposal — Stage 2. Review/edit this file; artifacts are created only after your confirmation.
source: inbox/vision-scope-document.docx
input_type: "Vision & Scope document (2014-05-26, v0.1) — scope-level, thin on story detail; stories below are high-level and will carry open questions"

unmapped:
  - item: "Upgradable product (ability to add more features)" 
    source: "5.2 Product Features, item 5"
    note: "Architecture principle, not a requirements artifact; already reflected in VIS-001 guiding principle 'Ship small, grow fast'"
  - item: "Design must serve both 1-3 oven clients and 100-300 oven clients"
    source: "5.5 User Interface Requirements"
    note: "Cross-cutting design constraint — propose recording as AC-level constraint on FLT epic; confirm"
  - item: "Stakeholder register (CTO, CIO, designers, sales...)"
    source: "3.2 / Table 5"
    note: "Context, not requirements; kept out of the tree"

open_questions:
  - "Remote ON/OFF safety & liability uninvestigated (4.2, 5.4) — blocks FLT bulk on/off stories"
  - "Statistics granularity/periods not specified (4.2) — per oven, per store, per fleet? retention?"
  - "Access hierarchy requirements unknown beyond 'big store has its own hierarchy' (5.2)"
  - "Support channel for 24/7 undefined (5.2) — phone/chat/email?"
  - "How client-defined roles relate to panel pin-code roles (User/Baker/Service/Supervisor)"
  - "Offline/restricted networks (5.4) — does fleet control work without internet?"

new_domains: []   # all items fit the bootstrap map

tree:
  - domain: fleet_control
    epics:
      - title: "Fleet remote control"
        vision_goal: VIS-001/G1
        summary: "From 1:1 panel mirror to central control of all client ovens"
        features:
          - title: "Oven fleet registry and grouping"
            summary: "Client sees all his ovens, grouped by store; scales 1-300"
            stories:
              - {title: "User can see the list of all ovens of his fleet", source: "2.2 Problem Statement"}
              - {title: "User can group ovens by store", source: "2.2 / 5.5"}
          - title: "Remote panel control of a selected oven"
            summary: "Legacy RC mirror as foundation: full panel UI on PC for one oven"
            stories:
              - {title: "User can open and control the panel UI of a selected oven", source: "2.1 Remote Control feature"}
          - title: "Bulk oven operations"
            summary: "Actions on many ovens at once"
            stories:
              - {title: "User can turn ON/OFF one or many ovens remotely", source: "4.2 Users Goals", note: "blocked by liability open question"}
  - domain: recipes
    epics:
      - title: "Fleet recipe management"
        vision_goal: VIS-001/G1
        summary: "Recipes and settings across the whole fleet instead of oven-by-oven"
        features:
          - title: "Recipe download and viewing"
            stories:
              - {title: "User can download a recipe from an oven and view it on PC", source: "2.1"}
          - title: "Recipe upload to ovens"
            stories:
              - {title: "User can upload a recipe from PC to an oven", source: "2.1"}
              - {title: "User can upload programs (settings, recipes) to all ovens at one time", source: "4.2"}
          - title: "Recipe pictures"
            stories:
              - {title: "User can upload a picture so the recipe list shows recipes with pictures", source: "2.1"}
  - domain: statistics
    epics:
      - title: "Fleet statistics"
        vision_goal: VIS-001/G2
        summary: "Statistics per oven and aggregated across the fleet"
        features:
          - title: "Energy consumption statistics"
            stories: [{title: "User can view energy consumption per oven and per fleet", source: "4.2 / 2.3"}]
          - title: "Temperature statistics"
            stories: [{title: "User can view temperature readings history", source: "4.2"}]
          - title: "Production/recipe statistics"
            stories: [{title: "User can compare production between stores (e.g. baguette output)", source: "4.2"}]
          - title: "Door events statistics"
            stories: [{title: "User can view oven door opening/closing statistics", source: "4.2"}]
          - title: "Service statistics for Northbake support"
            stories: [{title: "Northbake support can view service statistics of client ovens", source: "4.2"}]
  - domain: access_control
    epics:
      - title: "Client access management"
        vision_goal: VIS-001/G4
        summary: "Client builds his own roles and permissions for his business"
        features:
          - title: "Custom roles and permissions"
            stories:
              - {title: "Client can create roles with different access levels for his staff", source: "5.2 item 2"}
  - domain: software_updates
    epics:
      - title: "Centralized panel software updates"
        vision_goal: VIS-001/G1
        summary: "Replace per-oven USB flashing with central update delivery"
        features:
          - title: "Bulk panel software upgrade"
            stories:
              - {title: "User can upgrade panel software on all ovens at one time", source: "4.2 / 2.2"}
  - domain: help_support
    epics:
      - title: "End-user help service"
        vision_goal: VIS-001/G4
        summary: "Self-service help and support for product users"
        features:
          - title: "Documentation and tutorials"
            stories:
              - {title: "User can access getting-started docs, guides, tutorials and FAQ", source: "5.2 item 3"}
          - title: "24/7 support access"
            stories:
              - {title: "User can reach 24/7 support from the product", source: "5.2 item 3", note: "channel undefined — open question"}
  - domain: localization
    epics:
      - title: "Multi-language product"
        vision_goal: VIS-001/G4
        summary: "Core languages + easy addition of new ones"
        features:
          - title: "Core language support"
            stories:
              - {title: "User can use the product in Swedish, English, Chinese, Russian", source: "5.2 item 4"}
          - title: "Language extensibility"
            stories:
              - {title: "New languages can be added without redesign (DE/AR planned)", source: "5.2 item 4", note: "smells like NFR — confirm story vs constraint"}
